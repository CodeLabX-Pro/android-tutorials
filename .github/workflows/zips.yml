# Packs every tutorial folder into its own ZIP and attaches it to the "downloads" release,
# so codelab-x.com can link to releases/download/downloads/<folder>.zip.
name: Tutorial ZIPs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build one ZIP per tutorial
        run: |
          mkdir -p dist
          for dir in */; do
            name="${dir%/}"
            [ -f "$name/settings.gradle.kts" ] || continue
            zip -qr "dist/$name.zip" "$name" -x "$name/build/*" "$name/app/build/*" "$name/.gradle/*" "$name/local.properties"
          done
          ls -l dist
      - name: Publish to the downloads release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view downloads >/dev/null 2>&1 || gh release create downloads --title "Tutorial downloads" --notes "One ZIP per tutorial. Open the folder in Android Studio and press Run."
          gh release upload downloads dist/*.zip --clobber
